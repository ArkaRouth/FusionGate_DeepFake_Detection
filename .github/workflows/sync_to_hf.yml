name: Sync to Hugging Face Space
on:
  push:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          # Force git to treat the current state as the 'main' branch
          git checkout -b main || git checkout main
          # Force push to overwrite remote history completely
          git push --force https://minus2:$HF_TOKEN@huggingface.co/spaces/minus2/Fusion-Gate-Deepfake-Detector main
